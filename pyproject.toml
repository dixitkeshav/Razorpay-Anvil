[project]
name = "anvil"
version = "0.1.0"
description = "Payment-degradation detection and revenue-recovery system — Razorpay AI Buildathon Track 03"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.30",
    "polars>=1.9",
    "duckdb>=1.1",
    "numpy>=2.0",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "razorpay>=1.4",
    "groq>=0.11",
    "mcp>=1.2",
    "python-dotenv>=1.0",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
