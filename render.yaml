services:
  # Single service: the root Dockerfile builds the dashboard (web/) in an
  # earlier stage and bundles the static output into the API image, so
  # FastAPI serves both the SPA and /api/* on one Render URL.
  - type: web
    name: anvil
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ANVIL_LLM_OFFLINE
        value: "0"
