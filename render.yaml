services:
  - type: web
    name: anvil-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ANVIL_LLM_OFFLINE
        value: "0"

  - type: web
    name: anvil-web
    env: docker
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    plan: free
    envVars:
      # Render's private network resolves other services in the same
      # blueprint by name, on the port each one declares via its own
      # PORT env var (anvil-api listens on 8000, see above).
      - key: ANVIL_API_URL
        value: http://anvil-api:8000
      - key: PORT
        value: 5173
